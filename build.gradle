plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.21'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { name = 'Maven Central'; url = 'https://repo1.maven.org/maven2' }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude('**/*.bbmodel')
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    implementation 'io.github.llamalad7:mixinextras-neoforge:0.5.0'

    compileOnly 'curse.maven:architectury-api-419699:5786327'
    localRuntime 'curse.maven:architectury-api-419699:5786327'
    compileOnly 'curse.maven:ftb-teams-forge-404468:8724782'
    localRuntime 'curse.maven:ftb-teams-forge-404468:8724782'
    compileOnly 'curse.maven:ftb-library-forge-404465:8569579'
    localRuntime 'curse.maven:ftb-library-forge-404465:8569579'
    compileOnly 'dev.ftb.mods:ftb-quests-neoforge:2101.1.34'
    localRuntime 'dev.ftb.mods:ftb-quests-neoforge:2101.1.34'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/repo" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(
            '-AoutRefMapFile=' + layout.buildDirectory.file("${mod_id}.refmap.json").get().asFile.absolutePath,
            '-Amixin.configs=' + mod_id + '.mixins.json'
    )
}

tasks.named('jar', Jar).configure {
    def mid = project.mod_id
    from(layout.buildDirectory.file("${mid}.refmap.json")) {
        rename { "${mid}.refmap.json" }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
